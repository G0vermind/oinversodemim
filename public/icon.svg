<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="svg-gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5EFE6" />
      <stop offset="35%" stop-color="#C9A24B" />
      <stop offset="70%" stop-color="#DE9E58" />
      <stop offset="100%" stop-color="#9E7634" />
    </linearGradient>
    <radialGradient id="svg-dark-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#181512" />
      <stop offset="100%" stop-color="#0E0D0B" />
    </radialGradient>
  </defs>

  <!-- Luxury Obsidian Rounded Container -->
  <rect x="7" y="7" width="498" height="498" rx="112" fill="url(#svg-dark-bg)" stroke="url(#svg-gold-grad)" stroke-width="14" />
  
  <!-- Subtle Inner Gold Hairline -->
  <rect x="22" y="22" width="468" height="468" rx="98" fill="none" stroke="#C9A24B" stroke-width="2" opacity="0.45" />

  <!-- Radiant Mirrored Central Flourish -->
  <g transform="translate(256, 120) scale(2.6)" fill="url(#svg-gold-grad)">
    <path d="M0 -10 L2.5 -2.5 L10 0 L2.5 2.5 L0 10 L-2.5 2.5 L-10 0 L-2.5 -2.5 Z" />
    <circle cx="-24" cy="0" r="1.5" opacity="0.85" />
    <circle cx="24" cy="0" r="1.5" opacity="0.85" />
    <path d="M-45 0 L-28 0" stroke="url(#svg-gold-grad)" stroke-width="0.8" opacity="0.7" />
    <path d="M28 0 L45 0" stroke="url(#svg-gold-grad)" stroke-width="0.8" opacity="0.7" />
  </g>

  <!-- Monogram & Brand Typography -->
  <text
    x="256"
    y="260"
    text-anchor="middle"
    font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif"
    font-size="64"
    font-weight="700"
    letter-spacing="0.14em"
    fill="url(#svg-gold-grad)"
  >
    O INVERSO
  </text>
  <text
    x="256"
    y="330"
    text-anchor="middle"
    font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif"
    font-size="56"
    font-weight="600"
    letter-spacing="0.22em"
    fill="url(#svg-gold-grad)"
  >
    DE MIM
  </text>

  <!-- Subtitle Ribbon -->
  <text
    x="256"
    y="405"
    text-anchor="middle"
    font-family="'EB Garamond', Georgia, serif"
    font-size="20"
    font-style="italic"
    letter-spacing="0.36em"
    fill="#C9A24B"
    opacity="0.9"
  >
    ✦ SANTUÁRIO POÉTICO ✦
  </text>
</svg>
