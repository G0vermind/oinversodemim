<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#241B15"/>
      <stop offset="100%" stop-color="#0F0D0B"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8DCC4"/>
      <stop offset="50%" stop-color="#C9A24B"/>
      <stop offset="100%" stop-color="#8A6B29"/>
    </linearGradient>
  </defs>
  <rect width="600" height="900" fill="url(#bgGrad)"/>
  <rect x="25" y="25" width="550" height="850" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.6"/>
  <rect x="35" y="35" width="530" height="830" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.3"/>
  
  <!-- Subtle decorative compass / path ornament -->
  <g transform="translate(300, 420)" stroke="url(#goldGrad)" stroke-width="1.5" fill="none" opacity="0.45">
    <circle r="120" stroke-dasharray="4,4"/>
    <circle r="70"/>
    <path d="M -150 0 L 150 0 M 0 -150 L 0 150"/>
    <polygon points="0,-100 12,-15 0,0 -12,-15" fill="#C9A24B" opacity="0.7"/>
    <polygon points="0,100 12,15 0,0 -12,15" fill="#8A6B29" opacity="0.7"/>
  </g>

  <!-- Typography -->
  <text x="300" y="220" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="44" letter-spacing="6" fill="#C9A24B">ANDANÇAS</text>
  <text x="300" y="270" text-anchor="middle" font-family="'EB Garamond', Georgia, serif" font-size="16" letter-spacing="4" fill="#A89F8C">COLETÂNEA POÉTICA</text>

  <line x1="200" y1="300" x2="400" y2="300" stroke="url(#goldGrad)" stroke-width="1" opacity="0.5"/>

  <text x="300" y="780" text-anchor="middle" font-family="'EB Garamond', Georgia, serif" font-size="18" letter-spacing="3" fill="#E8DCC4">HELDEMARCIO FERREIRA</text>
</svg>
