<svg viewBox="0 0 340 70" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gold-brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5EFE6" />
      <stop offset="35%" stop-color="#C9A24B" />
      <stop offset="70%" stop-color="#DE9E58" />
      <stop offset="100%" stop-color="#9E7634" />
    </linearGradient>
  </defs>

  <!-- Mirrored Central Flourish -->
  <g transform="translate(170, 16)" fill="url(#gold-brand-grad)">
    <path d="M0 -10 L2.5 -2.5 L10 0 L2.5 2.5 L0 10 L-2.5 2.5 L-10 0 L-2.5 -2.5 Z" />
    <circle cx="-24" cy="0" r="1.5" opacity="0.8" />
    <circle cx="24" cy="0" r="1.5" opacity="0.8" />
    <path d="M-45 0 L-28 0" stroke="url(#gold-brand-grad)" stroke-width="0.8" opacity="0.6" />
    <path d="M28 0 L45 0" stroke="url(#gold-brand-grad)" stroke-width="0.8" opacity="0.6" />
  </g>

  <!-- Main Title: O INVERSO DE MIM -->
  <text
    x="170"
    y="42"
    text-anchor="middle"
    font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif"
    font-size="24"
    font-weight="600"
    letter-spacing="0.22em"
    fill="url(#gold-brand-grad)"
  >
    O INVERSO DE MIM
  </text>

  <!-- Subtitle: SANTUÁRIO POÉTICO -->
  <text
    x="170"
    y="58"
    text-anchor="middle"
    font-family="'EB Garamond', Georgia, serif"
    font-size="8.5"
    font-style="italic"
    letter-spacing="0.32em"
    fill="#C9A24B"
    opacity="0.8"
  >
    ✦ SANTUÁRIO POÉTICO ✦
  </text>
</svg>
